# Development-only broker configuration for the r360-reasoning gate.
#
# Anonymous access is acceptable here and nowhere else: this broker exists only inside the
# compose network for the duration of a gate run, is never published to a host port, and
# carries synthetic fixture data. Any deployed broker requires authentication and TLS.
listener 1883
allow_anonymous true

# Keep the broker honest about what it accepted: QoS 1 delivery is what the gate asserts.
persistence false
log_dest stdout
log_type warning
log_type error
