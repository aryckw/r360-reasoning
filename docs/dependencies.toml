# Declared third-party dependencies for r360-reasoning.
#
# What is absent matters as much as what is present: no numpy, no scipy, no torch, no
# sigmf. Reasoning consumes structured evidence, not signals (REQ-REA-001).

[dependency.python3]
version = "3.11.2-1+b1"
license = "PSF-2.0"
why = "the service runtime; Python owns reasoning and tooling (ADR-0006 in r360-contracts)"

[dependency.python3-venv]
version = "3.11.2-1+b1"
license = "PSF-2.0"
why = "Debian interpreter is externally managed; dependencies install into a venv"

[dependency.make]
version = "unpinned"
license = "GPL-3.0-or-later"
why = "runs the gate targets inside the container; utility, not output-affecting"

[dependency.git]
version = "unpinned"
license = "GPL-2.0"
why = "build identity and the clean-diff check; utility, not output-affecting"

[dependency.ca-certificates]
version = "unpinned"
license = "MPL-2.0 and GPL-2.0-or-later"
why = "TLS trust store for package installation; utility, not output-affecting"

[dependency.protobuf]
version = "4.25.3"
license = "BSD-3-Clause"
why = "canonical contract runtime; evidence arrives as Protobuf"

[dependency.grpcio]
version = "1.62.2"
license = "Apache-2.0"
why = "gRPC server for health and version"

[dependency.grpcio-tools]
version = "1.62.2"
license = "Apache-2.0"
why = "generates the Python bindings from the vendored contracts"

[dependency.paho-mqtt]
version = "2.1.0"
license = "EPL-2.0 OR EDL-1.0"
why = "MQTT client for at-least-once evidence intake"

[dependency."psycopg[binary]"]
version = "3.2.1"
license = "LGPL-3.0-or-later"
why = "PostgreSQL driver; the evidence ID primary key is what makes intake idempotent"

[dependency.pytest]
version = "8.2.2"
license = "MIT"
why = "test runner for unit, boundary and integration tests"

[dependency.ruff]
version = "0.5.7"
license = "MIT"
why = "format and lint gate"

[dependency.mypy]
version = "1.10.1"
license = "MIT"
why = "strict type gate"
